4px 13px #164b9d20}.result-panel{margin-top:15px;padding:17px;border-radius:16px;background:linear-gradient(135deg,#edf5ff,#f8fbff);border:1px solid #dceaff;text-align:center}.result-label{font-size:9px;color:#7e9cc5;letter-spacing:1.8px;font-weight:900}.result-rank{font-size:34px;color:#2465df;font-weight:950;margin:6px 0 1px;letter-spacing:-1px}.result-company{font-size:13px;color:#365781;font-weight:800}.result-list{margin-top:14px}.result-row{display:flex;align-items:center;justify-content:space-between;padding:11px 1px;border-bottom:1px solid #edf2f8;font-size:11px}.result-row:last-child{border-bottom:0}.result-row span{color:#879bb7}.result-row b{color:#36577f;font-weight:850}.result-row.mine b{color:#2468e7}.result-row .pending{color:#b2bfd0;font-weight:650}.toast{position:fixed;z-index:20;left:50%;bottom:24px;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#173c79;color:#fff;border-radius:30px;padding:12px 18px;font-size:11px;box-shadow:0 10px 25px #173c7930;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}

<body>
<div class="phone">
  <header class="hero">
    <div class="hero-top"><div class="brand"><span class="brand-mark">序</span>风险异常抽查</div><span class="live">●　现场公开抽签</span></div>
    <div class="kicker">NOVEMBER · ORDER DRAW</div>
    <h1>11月风险异常<br><span>抽查顺序</span></h1>
    <p>四家分公司 · 先认领先抽 · 随机确定最终顺位</p>
  </header>
  <main class="content">
    <section class="card" id="chooseCard">
      <div class="card-head"><h2>选择所属分公司</h2><span class="step">STEP 01 / 02</span></div>
      <p class="subline">请选择你所在的分公司，确认认领后即可加入抽签队列。</p>
      <div class="branch-grid" id="branchGrid"></div>
      <button class="primary" id="claimBtn" type="button" disabled>确认认领 <span class="arrow">→</span></button>
      <p class="hint">认领先后决定抽签先后，最终名次由转盘随机产生。</p>
    </section>
    <section class="card status-card" id="statusCard">
      <div class="card-head"><h2 id="statusTitle">认领成功</h2><span class="step" id="statusStep">STEP 02 / 02</span></div>
      <div id="statusBody"></div>
      <div class="result-list" id="queueList"></div>
    </section>
    <div class="flow"><b>01 认领分公司</b><i></i><span>02 开始抽签</span><i></i><span>03 公布结果</span></div>
    <div class="footer-note">NOVEMBER RISK REVIEW · OFFICIAL DRAW</div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>(() => {
'use strict';
const KEY = 'nov-risk-order-draw-blue-v2';
const NAMES = ['郫都','龙泉','宜宾','双流'];
const SPIN_MS = 4600;
const IS_HTTP = /^https?:$/i.test(location.protocol);
let memory = { claims: [], spin: null, version: 2, updated: 0 };
let synced = !IS_HTTP;
const seenSpins = {};
let channel = null;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const val = JSON.parse(raw);
    if (val && Array.isArray(val.claims)) memory = val;
  }
} catch (_) {}
try {
  if ('BroadcastChannel' in window) {
    channel = new BroadcastChannel(KEY);
    channel.onmessage = () => window.dispatchEvent(new Event('riskdraw:change'));
  }
} catch (_) {}
function load() {
  if (!IS_HTTP) {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const value = JSON.parse(raw);
        if (value && Array.isArray(value.claims)) return value;
      }
    } catch (_) {}
  }
  return memory;
}
function save(data, skipBroadcast) {
  data.updated = Date.now();
  memory = data;
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (_) {}
  if (!skipBroadcast) {
    try { if (channel) channel.postMessage({ type: 'refresh', updated: data.updated }); } catch (_) {}
  }
  window.dispatchEvent(new Event('riskdraw:change'));
}
function applyServer(srv) {
  if (!srv || !Array.isArray(srv.claims)) return;
  synced = true;
  let newSpin = null;
  if (srv.spin && srv.spin.id) {
    const sid = srv.spin.id;
    const age = typeof srv.spin.age_ms === 'number' ? srv.spin.age_ms : 0;
    if (!seenSpins[sid]) {
      seenSpins[sid] = age < SPIN_MS ? (Date.now() - Math.min(age, 350)) : (Date.now() - Math.max(age, SPIN_MS + 500));
    }
    newSpin = { id: sid, branch: srv.spin.branch, rank: srv.spin.rank, time: seenSpins[sid] };
  }
  const prevSig = JSON.stringify({ c: memory.claims, s: memory.spin ? memory.spin.id : null });
  const nextSig = JSON.stringify({ c: srv.claims, s: newSpin ? newSpin.id : null });
  memory = { claims: srv.claims, spin: newSpin, version: srv.version || 2, updated: srv.updated || Date.now() };
  try { localStorage.setItem(KEY, JSON.stringify(memory)); } catch (_) {}
  if (prevSig !== nextSig) {
    window.dispatchEvent(new Event('riskdraw:change'));
  }
}
async function syncFromServer() {
  if (!IS_HTTP) return;
  try {
    const r = await fetch('/draw/api/state?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) applyServer(await r.json());
  } catch (_) {}
}
window.addEventListener('storage', e => {
  if (e.key === KEY && !IS_HTTP) window.dispatchEvent(new Event('riskdraw:change'));
});
const uid = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
function randomIndex(max) {
  if (max <= 1) return 0;
  if (window.crypto && crypto.getRandomValues) {
    const limit = Math.floor(4294967296 / max) * max;
    const a = new Uint32Array(1);
    do { crypto.getRandomValues(a); } while (a[0] >= limit);
    return a[0] % max;
  }
  return Math.floor(Math.random() * max);
}
function claim(branch) {
  if (!NAMES.includes(branch)) return { ok: false, error: '请选择所属分公司' };
  const d = load();
  if (d.claims.some(x => x.branch === branch)) return { ok: false, error: '该分公司已经认领' };
  if (d.claims.length >= 4) return { ok: false, error: '四家分公司均已完成认领' };
  const item = { id: uid(), branch, time: Date.now(), seat: d.claims.length + 1, rank: null };
  d.claims.push(item);
  save(d);
  if (IS_HTTP) {
    fetch('/draw/api/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ branch, id: item.id })
    }).then(r => r.json()).then(res => {
      if (res && res.state) applyServer(res.state);
    }).catch(() => {});
  }
  return { ok: true, item };
}
function draw(branch) {
  const d = load();
  if (d.spin && Date.now() - d.spin.time < SPIN_MS) return { ok: false, error: '上一轮正在揭晓，请稍候' };
  const me = d.claims.find(x => x.branch === branch);
  if (!me) return { ok: false, error: '请先认领抽签席位' };
  if (me.rank) return { ok: false, error: '该分公司已经完成抽签' };
  const next = d.claims.find(x => !x.rank);
  if (!next || next.branch !== branch) return { ok: false, error: '请按照认领先后顺序依次抽签' };
  const available = [1, 2, 3, 4].filter(rank => !d.claims.some(x => x.rank === rank));
  if (!available.length) return { ok: false, error: '本场抽签已经结束' };
  const rank = available[randomIndex(available.length)];
  me.rank = rank;
  const spin = { id: uid(), branch, rank, time: Date.now() };
  seenSpins[spin.id] = spin.time;
  d.spin = spin;
  save(d);
  if (IS_HTTP) {
    fetch('/draw/api/draw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ branch, rank, spin_id: spin.id })
    }).then(r => r.json()).then(res => {
      if (res && res.state) applyServer(res.state);
    }).catch(() => {});
  }
  return { ok: true, rank, spin: d.spin };
}
function reset() {
  Object.keys(seenSpins).forEach(k => delete seenSpins[k]);
  save({ claims: [], spin: null, version: 2, updated: Date.now() });
  if (IS_HTTP) {
    fetch('/draw/api/reset', { method: 'POST' }).then(r => r.json()).then(res => {
      if (res && res.state) applyServer(res.state);
    }).catch(() => {});
  }
}
function listen(fn) {
  window.addEventListener('riskdraw:change', fn);
  fn();
  if (IS_HTTP) {
    syncFromServer();
    setInterval(syncFromServer, 500);
  }
}
window.RiskDraw = { KEY, NAMES, SPIN_MS, load, claim, draw, reset, listen, isSynced: () => synced, zh: ['', '第一', '第二', '第三', '第四'] };
})();</script>
<script>
(()=>{'use strict';
const D=RiskDraw,$=id=>document.getElementById(id),EN=['PIDU','LONGQUAN','YIBIN','SHUANGLIU'];
let selected='',identity='',lastSpin='',degrees=0,renderTimer=null;
try{identity=sessionStorage.getItem('nov-risk-my-branch-v2')||''}catch(_){}
function setIdentity(v){identity=v;try{sessionStorage.setItem('nov-risk-my-branch-v2',v)}catch(_){}}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),2300)}

const wheelSVG='<svg class="mini-wheel" id="miniWheel" viewBox="0 0 600 600" role="img" aria-label="抽查顺序转盘"><path fill="#2868e9" d="M300 300L87.9 87.9A300 300 0 0 1 512.1 87.9Z"/><path fill="#9bc4ff" d="M300 300L512.1 87.9A300 300 0 0 1 512.1 512.1Z"/><path fill="#e1efff" d="M300 300L512.1 512.1A300 300 0 0 1 87.9 512.1Z"/><path fill="#5b96f4" d="M300 300L87.9 512.1A300 300 0 0 1 87.9 87.9Z"/><path d="M87.9 87.9L512.1 512.1M512.1 87.9L87.9 512.1" stroke="#fff" stroke-opacity=".6" stroke-width="3"/><g text-anchor="middle" font-family="sans-serif" font-weight="900"><g fill="#fff" transform="translate(300 128)"><text font-size="14" y="-13">NO.01</text><text font-size="54" y="48">第一</text></g><g fill="#17458f" transform="translate(472 300)"><text font-size="14" y="-13">NO.02</text><text font-size="54" y="48">第二</text></g><g fill="#17458f" transform="translate(300 472)"><text font-size="14" y="-13">NO.03</text><text font-size="54" y="48">第三</text></g><g fill="#fff" transform="translate(128 300)"><text font-size="14" y="-13">NO.04</text><text font-size="54" y="48">第四</text></g></g><circle cx="300" cy="300" r="292" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/></svg>';
function spinWheel(rank){const el=$('miniWheel');if(!el)return;const target=[0,270,180,90][rank-1],add=(target-(degrees%360)+360)%360,from=degrees;degrees+=add+2160;el.classList.remove('spin');el.style.transform='rotate('+from+'deg)';void el.offsetWidth;el.classList.add('spin');el.style.transform='rotate('+degrees+'deg)'}
function resultList(d,hideCurrent){return [1,2,3,4].map(rank=>{const c=d.claims.find(x=>x.rank===rank&&!(hideCurrent&&d.spin&&x.branch===d.spin.branch));return '<div class="result-row '+(c&&c.branch===identity?'mine':'')+'"><span>'+D.zh[rank]+'顺位</span><b class="'+(c?'':'pending')+'">'+(c?safe(c.branch)+'分公司':'等待揭晓')+'</b></div>'}).join('')}
function render(){const d=D.load(),me=d.claims.find(c=>c.branch===identity),next=d.claims.find(c=>!c.rank),fresh=!!(d.spin&&Date.now()-d.spin.time<D.SPIN_MS);
if(identity&&!me&&(!D.isSynced||D.isSynced())){setIdentity('');identity='';lastSpin=''}
$('branchGrid').innerHTML=D.NAMES.map((b,i)=>{const taken=d.claims.some(c=>c.branch===b);return '<button class="branch '+(selected===b?'selected ':'')+(taken?'taken':'')+'" type="button" data-branch="'+b+'" '+(taken?'disabled':'')+'><span class="branch-check">'+(selected===b?'✓':taken?'✓':'')+'</span><span class="branch-status">'+(taken?'已认领':'')+'</span><strong class="branch-name">'+b+'</strong><span class="branch-en">'+EN[i]+' · 分公司</span></button>'}).join('');
$('claimBtn').disabled=!selected||d.claims.some(c=>c.branch===selected);
if(!me){$('chooseCard').style.display='block';$('statusCard').style.display='none';return}
$('chooseCard').style.display='none';$('statusCard').style.display='block';const seat=d.claims.indexOf(me)+1;
let body='';
if(me.rank){
 if(fresh&&d.spin&&d.spin.branch===identity){$('statusTitle').textContent='转盘正在旋转';$('statusStep').textContent='DRAWING';body='<div class="seat"><div class="seat-no">'+String(seat).padStart(2,'0')+'</div><div class="seat-info"><small>YOUR DRAW SEAT</small><strong>'+safe(identity)+'分公司</strong><p>已认领成功 · 正在揭晓抽查顺位</p></div></div><div class="mini-wheel-wrap"><span class="mini-pointer"></span>'+wheelSVG+'<span class="mini-hub">抽签</span></div><div class="status-message"><strong>请看大屏，结果即将揭晓</strong><p>转盘停止后，你的抽查顺位将同步显示在本页面。</p></div>';
  if(lastSpin!==d.spin.id){lastSpin=d.spin.id;requestAnimationFrame(()=>spinWheel(me.rank));clearTimeout(renderTimer);renderTimer=setTimeout(render,Math.max(30,D.SPIN_MS-(Date.now()-d.spin.time))+50)}
 }else{$('statusTitle').textContent='抽签已完成';$('statusStep').textContent='COMPLETED';body='<div class="seat"><div class="seat-no">'+String(seat).padStart(2,'0')+'</div><div class="seat-info"><small>YOUR DRAW SEAT</small><strong>'+safe(identity)+'分公司</strong><p>抽签顺位已经确定</p></div></div><div class="result-panel"><div class="result-label">YOUR DRAW RESULT</div><div class="result-rank">'+D.zh[me.rank]+'顺位</div><div class="result-company">'+safe(identity)+'分公司</div></div>'}
}else if(fresh){
 $('statusTitle').textContent='上一轮正在揭晓';$('statusStep').textContent='PLEASE WAIT';body='<div class="seat"><div class="seat-no">'+String(seat).padStart(2,'0')+'</div><div class="seat-info"><small>YOUR DRAW SEAT</small><strong>'+safe(identity)+'分公司</strong><p>已成功认领抽签席位</p></div></div><div class="status-message"><strong>请稍候，上一轮结果正在揭晓</strong><p>'+safe(d.spin.branch)+'分公司正在抽签，结果公布后将轮到下一家。</p></div>';

 $('statusTitle').textContent='轮到你抽签了';$('statusStep').textContent='YOUR TURN';body='<div class="seat"><div class="seat-no">'+String(seat).padStart(2,'0')+'</div><div class="seat-info"><small>YOUR DRAW SEAT</small><strong>'+safe(identity)+'分公司</strong><p>已轮到你，请准备开始抽签</p></div></div><div class="status-message"><strong>现在由你开启转盘</strong><p>认领先后只决定抽签先后，第一至第四顺位由转盘随机决定。</p></div><button class="primary" id="drawBtn" type="button">开始抽签 <span class="arrow">→</span></button>';
}else{
 $('statusTitle').textContent='认领成功 · 请候场';$('statusStep').textContent='WAITING';body='<div class="seat"><div class="seat-no">'+String(seat).padStart(2,'0')+'</div><div class="seat-info"><small>YOUR DRAW SEAT</small><strong>'+safe(identity)+'分公司</strong><p>已成功认领抽签席位</p></div></div><div class="status-message"><strong>请稍候，暂未轮到你</strong><p>当前由 '+safe(next?next.branch+'分公司':'其他分公司')+' 抽签。轮到你时，本页面会自动更新。</p></div>';
}

}
